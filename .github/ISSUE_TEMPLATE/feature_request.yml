name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) first —
        it lists the kinds of change that will not be accepted, so you do not
        spend time writing up something that is out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the situation, not the solution. "I download long Twitch VODs
        and lose progress when my laptop sleeps" tells more than "add a resume
        button" — there may be a better fix than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do about it today
      description: Existing workaround, another tool, or nothing.
    validations:
      required: false
