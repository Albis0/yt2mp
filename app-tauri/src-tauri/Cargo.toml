[package]
name = "yt2mp"
version = "0.7.16"
description = "Ad-free YouTube to MP3/MP4 downloader"
authors = ["Albis0"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri builds the app as a library plus a thin binary so the same code can be
# reused by mobile targets and integration tests.
name = "yt2mp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is what lets one window hold more than one webview: the
# built-in browser's tabs are child webviews of the main window.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Self-update: checks a signed manifest on the GitHub release and installs the
# new build. tauri-plugin-process supplies the relaunch() that follows it.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Used for one thing: telling Windows from Linux, because only Windows can
# install an update in place. See src/lib/updater.ts.
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime: the download commands spawn yt-dlp/ffmpeg and stream their
# output without blocking the IPC thread, so a slow download never freezes
# the UI the way a blocking std::process::Command would.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "fs", "macros"] }
# AI search talks to Groq over HTTPS. rustls instead of native-tls so the
# build doesn't need OpenSSL present on the machine.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
# Tab favicons arrive from WebView2 as PNG bytes and go to the UI as data URLs.
base64 = "0.22"

# The browser's tabs talk to WebView2 directly for what Tauri doesn't surface:
# same-page address changes, back/forward state, favicons, shortcuts. Same
# versions wry itself uses, so nothing is compiled twice.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
# Size matters here: the whole point of leaving Electron was the download
# size. LTO + one codegen unit + stripped symbols cut the binary roughly in
# half versus the default release profile.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
